server:
  port: 8080

spring:
  application:
    name: fraud-detection-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_detection_db}
    username: ${SPRING_DATASOURCE_USERNAME:fraud_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:fraud_password_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

fraud:
  kafka:
    inbound-topic: transactions.inbound
    alerts-topic: transactions.alerts
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: 1500
  thresholds:
    approve-max: 0.30
    review-max: 0.70
    weights:
      rule-weight: 0.40
      ml-weight: 0.60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

version: '3.8'

services:
  # ==========================================
  # 1. Apache Kafka & Zookeeper (Event Stream)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraudshield-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraudshield-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fraud-network

  # ==========================================
  # 2. Redis Cache & Sliding Window State
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: fraudshield-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - fraud-network

  # ==========================================
  # 3. PostgreSQL Database (Audit & History)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: fraudshield-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraud_detection_db
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: fraud_password_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend-spring-boot/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fraud-network

  # ==========================================
  # 4. Python ML & Explainable AI Service
  # ==========================================
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fraudshield-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_TYPE=xgboost
    networks:
      - fraud-network

  # ==========================================
  # 5. Java Spring Boot Backend Engine
  # ==========================================
  backend:
    build:
      context: ./backend-spring-boot
      dockerfile: Dockerfile
    container_name: fraudshield-backend
    depends_on:
      - kafka
      - redis
      - postgres
      - ml-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_detection_db
      SPRING_DATASOURCE_USERNAME: fraud_admin
      SPRING_DATASOURCE_PASSWORD: fraud_password_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_SERVICE_URL: http://ml-service:8000
    networks:
      - fraud-network

  # ==========================================
  # 6. React.js Real-time Dashboard
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraudshield-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
